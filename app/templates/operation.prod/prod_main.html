<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            animation: GradientAnimation 10s ease infinite;
        }

        @keyframes GradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }


        h2 {
            color: #333;
            font-size: calc(1.5vh + 0.35vw);
            font-weight: normal;
            margin: 0;
            height: 3vh;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.4vh;
            height: calc(97% - (0.3vw + 1vh)  * 2);
        }

        .calendar-day {
            align-items: center;
            justify-content: center;
            height: calc(3vh + 1.3vw);
            border: 1px solid #ccc;
            text-align: center;
            font-size: 14px;
            background: white;
            border-radius: 5px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #CAD5D3;

        }

        .day-label {
            font-weight: bold;
            font-size: calc(1vh + 0.6vw);
            grid-column: span 3;
            margin-bottom: 0;
        }

        .day-section {
            height: calc(1.5vh + 0.5vw);
            padding-top: 0.3vh;
            text-align: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-top: auto;
            font-size: calc(1.3vh + 0.3vw);
        }

        .red { background-color: #b50a0a; opacity: 0.7; }
        .green { background-color: #228c22; opacity: 0.7; }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1vh;
            width: 88vw;
            height: 100vh;
            padding: calc(0.5vh);
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: calc(100% - (0.3vw + 1vh) * 2);
            height: calc(100% - (0.3vw + 1vh) * 2);
            padding: calc(0.3vw + 1vh);
            display: flex;
            flex-direction: column;
        }


        .sidebar {
            width: 12vw;
            background-color: #153A8A;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            padding-bottom: 10px;
            text-align: center;
        }

        .sidebar-text {
            font-size: calc(1.5vh + 0.6vw);
            margin-bottom: 20px;
            font-weight: bold;
        }

        #dateText:hover {
            background-color: white;
            color: #153A8A;
            cursor: inherit;
        }

        .sidebar button {
            background-color: white;
            color: #153A8A;
            padding: 10px 20px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 1em;
            width: 80%;
        }

        .sidebar button:hover {
            background-color: #2e52a7;
            color: white;
        }

        .legend {
            font-size: calc(1vh + 0.3vw);
            margin-bottom: 20px;
            text-align: left;
        }

        .legend p {
            margin: 5px 0;
            font-weight: bold;
        }

        .legend .color-box {
            width: 15px;
            height: 15px;
            display: inline-block;
            margin-right: 5px;
            border-radius: 3px;
        }

        .loader {
            border: 2vh solid #163a8a;
            border-top: 2vh solid #3498db;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            height: calc(6vh + 5vw);
            width: calc(6vh + 5vw);
            margin: calc(2vh + 2.5vw) auto;
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>
    <div class="static-buttons"> 
        <button onclick="window.location='/'"><i class="fas fa-x"></i></button>
    </div>


    <div class="sidebar">
        <div class="sidebar-text">Operation<br>Meeting<br><br>KPIs de<br>Produção</div>

        <button class="sidebar-text" id="dateText" style="font-size: calc(1.3vh + 0.3vw);"></button>
        <button onclick="changeMonth(0)" style="font-size: calc(1.3vh + 0.3vw);">Anterior <i class="fas fa-angle-left"></i></button>
        <button onclick="changeMonth(1)" style="font-size: calc(1.3vh + 0.3vw);">Próximo <i class="fas fa-angle-right"></i></button>
        
        <div class="legend">
            <p style="width: 100%;text-align: center;margin-top: 2vh;">Metas</p>
            <div>
                <p><span class="color-box" style="background-color: #DC3545;"></span>Não atingiu</p>
                <p><span class="color-box" style="background-color: #28A745;"></span>Atingiu</p>
            </div>

            <p style="width: 100%;text-align: center;margin-top: 2vh;">Letras</p>
            <div>
                <p><span style="font-weight: bold;">P - </span>Performance</p>
                <p><span style="font-weight: bold;">D - </span>Disponibilidade</p>
                <p><span style="font-weight: bold;">Q - </span>Qualidade</p>
            </div>
        </div>
        
        <button onclick="window.location.href='/op/producao/indicadores'" style="margin-top: auto;">ANÁLISE</button>
        <button onclick="window.location='/tutorial/download?file=op_meeting_production'">
            <i class="fa fa-info-circle"></i> INFO
        </button>
    </div>

    <div class="grid-layout">
        <div class="container">
            <h2>Montagem</h2>
            <div style="margin-bottom: auto;" class="addCalendar"></div>
        </div>

        <div class="container">
            <h2>Usinagem</h2>
            <div style="margin-bottom: auto;" class="addCalendar"></div>
        </div>

        <div class="container">
            <h2>Soldagem</h2>
            <div style="margin-bottom: auto;" class="addCalendar"></div>
        </div>

        <div class="container">
            <h2>Pré-Fabricação</h2>
            <div style="margin-bottom: auto;" class="addCalendar"></div>
        </div>
    </div>

    <script>
        let month = parseInt('{{month}}')
        let year = parseInt('{{year}}')

        const areasNames = {
            0: 'Montagem',
            1: 'Usinagem',
            2: 'Soldagem',
            3: 'Pré-Fabricação'
        }

        // ATUALIZA O NOME DO MES NA TELA
        function showMonthName() {
            const edit = new Intl.DateTimeFormat('pt-BR', { month: 'long' });
            let monthName = edit.format(new Date(year, month - 1, 1));
            document.getElementById('dateText').innerHTML = `${monthName.toUpperCase()}<br>${year}`;
        }

        // MOSTRA O CALENDÁRIO
        function generateCalendar(month, year, data) {

            const containers = document.querySelectorAll('.container');
            containers.forEach((container, index) => {
                const addCalendarElement = container.querySelector('.addCalendar');
                addCalendarElement.innerHTML = '';

                const calendarDiv = document.createElement('div');
                calendarDiv.classList.add('calendar-grid');

                const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                
                // Criar cabeçalho com os nomes dos dias da semana
                daysOfWeek.forEach(day => {
                    const dayHeader = document.createElement('div');
                    dayHeader.classList.add('calendar-day');
                    
                    const label = document.createElement('span');
                    label.textContent = day;
                    label.classList.add('day-label');

                    dayHeader.appendChild(label);
                    dayHeader.style.height = 'calc(2vh + 1vw)'
                    dayHeader.style.backgroundColor = '#94AEBB'
                    calendarDiv.appendChild(dayHeader);
                });

                // Obter o primeiro dia da semana do mês (0 = domingo, 6 = sábado)
                const firstDayIndex = new Date(year, month - 1, 1).getDay();
                const daysInMonth = new Date(year, month, 0).getDate();

                // Criar os espaços vazios antes do primeiro dia do mês
                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.classList.add('calendar-day', 'empty-day');
                    calendarDiv.appendChild(emptyDiv);
                }

                // Preencher os dias do mês
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.classList.add('calendar-day');

                    const dayData = data.find(d => d.Time_Group.split('/')[0] == day && d.Workcenter_Group == areasNames[index]);

                    const top = document.createElement('div');
                    top.classList.add('day-section');
                    top.style.borderRadius = '5px 0 0 5px';

                    const middle = document.createElement('div');
                    middle.classList.add('day-section');

                    const bottom = document.createElement('div');
                    bottom.classList.add('day-section');
                    bottom.style.borderRadius = '0 5px 5px 0';

                    if (dayData) {

                        top.innerText = 'P';
                        top.classList.add(dayData.Performance >= 100 ? 'green' : 'red');

                        middle.innerText = 'D';
                        middle.classList.add(dayData.Availability >= 85 ? 'green' : 'red');

                        bottom.innerText = 'Q';
                        bottom.classList.add(dayData.Quality == 100 ? 'green' : 'red');

                        dayDiv.onclick = () => {
                            window.location.href = `/op/producao/indicadores?preload=${index}&day=${day}&month=${month}&year=${year}`;
                        };

                        dayDiv.style.cursor = 'pointer';
                    } else {
                        dayDiv.style.cursor = 'inherit';
                    }

                    const label = document.createElement('span');
                    label.textContent = day;
                    label.classList.add('day-label');

                    dayDiv.appendChild(label);
                    dayDiv.appendChild(top);
                    dayDiv.appendChild(middle);
                    dayDiv.appendChild(bottom);
                    calendarDiv.appendChild(dayDiv);
                }

                addCalendarElement.appendChild(calendarDiv);
            });
        }


        // ALTERA O MES, CHAMA A FUNÇÃO showMonthName, CHAMA A FUNÇÃO getData
        function changeMonth(direction) {

            if (direction === 0) {
                month--;
                if (month < 1) { 
                    month = 12;
                    year--;
                }

            } else if (direction === 1) {

                month++;
                if (month > 12) { 
                    month = 1;
                    year++;
                }
            }

            showMonthName()
            getData()

        }

        // REQUISIÇÃO PARA PEGAR OS DADOS, NO FINAL CHAMA A FUNCAO generateCalendar
        function getData() {

            const containers = document.querySelectorAll('.container');
            containers.forEach((container, index) => {
                const addCalendarElement = container.querySelector('.addCalendar');
                addCalendarElement.innerHTML = '<div class="loader"></div>';
            });
            
            const url = `/op/producao?year=${year}&month=${month}`;

            fetch(url, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    generateCalendar(month, year, data.calendar);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }

        
        // CARREGAMENTO INICIAL
        window.onload = function () {
            showMonthName()
            getData()
        };


    </script>
</body>
</html>
