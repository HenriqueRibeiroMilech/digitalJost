<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.min.js"></script>
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            object-fit: fill;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="video" src="/static/uploads/cockpit/video7.mp4" muted autoplay></video>
    </div>
</body>
<script>
    var monitorId = {{ monitor_id }};
    const video = document.getElementById('video');

    const monitorWidth = screen.width;
    const monitorHeight = screen.height;

    // Ajustar o tamanho do vídeo para cobrir os monitores
    video.style.width = `${monitorWidth * 3}px`; // 3x largura do monitor
    video.style.height = `${monitorHeight * 2}px`; // 2x altura do monitor

    function adjustVideoPosition(monitorId) {
        if (monitorId == 0) {
            video.style.top = '0px';
            video.style.left = '0px';
        } else if (monitorId == 1) {
            video.style.top = '0px';
            video.style.left = '-1920px';
        } else if (monitorId == 2) {
            video.style.top = '0px';
            video.style.left = '-3840px';
        } else if (monitorId == 3) {
            video.style.top = '-1080px';
            video.style.left = '0px';
        } else if (monitorId == 4) {
            video.style.top = '-1080px';
            video.style.left = '-1920px';
        } else if (monitorId == 5) {
            video.style.top = '-1080px';
            video.style.left = '-3840px';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        adjustVideoPosition(monitorId);
    });

    video.pause();
    video.currentTime = 0;

    document.addEventListener("DOMContentLoaded", function() {
        var socket = io.connect('https://' + document.domain + ':' + location.port + '/test');

        socket.on('connect', function() {
            console.log('Connected to the server');
        });

        socket.on('my_response', function(msg) {
            console.log('Received message: ' + msg.data);
        });

        socket.on('server_message', function(msg) {
            const checkTimeAndPlay = () => {
                const now = new Date();
                if (now.getSeconds() === 10) {
                    video.play();
                    clearInterval(checkInterval); // Stop checking once the video starts playing
                }
            };

            // Start checking the time every 100 milliseconds
            const checkInterval = setInterval(checkTimeAndPlay, 10);
        });
    });
</script>
</html>
