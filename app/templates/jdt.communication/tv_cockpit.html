<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital JOST</title>
<link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    iframe, video, img {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: none;
        z-index: 1000;
        overflow: hidden;
        object-fit: fill;
    }

    iframe.active, video.active, img.active {
        display: block;
    }
</style>
</head>
<body>

<iframe id="link-iframe"></iframe>
<video id="video-iframe" autoplay muted playsinline loop></video>
<img id="image-iframe">

<script>
    var toShow = '{{ toShow }}';
    var workCenter = '{{ workCenter }}';

    function sendRequest() {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/cockpit/tv?id={{tv}}&group={{group}}", true);
        xhr.setRequestHeader("Content-type", "application/json");
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = xhr.responseText;
                console.log(response)
                if (response.includes('CHANGE PAGE')) {
                    if (response.includes('ID_ACESSO')) {
                        var url = response.split(' ')[3] || response.split(' ')[4];
                    } else {
                        var url = response.split(' ')[2] || response.split(' ')[3];
                    }
                    
                    if (url !== toShow) {
                        toShow = url;
                        showContent(toShow);
                    }
                } else if (!response.includes('NOT UPDATE')) {
                    if (response.includes('ID_ACESSO')) {
                        var newToShow = response.split(' ')[2] || response.split(' ')[3];
                    } else {
                        var newToShow = response.split(' ')[1] || response.split(' ')[2];
                    }        
                    toShow = newToShow;
                    showContent(toShow);
                }
            }
        };
        xhr.send(JSON.stringify({ 'test': toShow, 'workCenter': workCenter }));
    }

    function showContent(url) {
        const iframe = document.getElementById('link-iframe');
        const video = document.getElementById('video-iframe');
        const image = document.getElementById('image-iframe');

        iframe.classList.remove('active');
        video.classList.remove('active');
        image.classList.remove('active');

        if (isNaN(url)) {
            iframe.src = url;
            iframe.classList.add('active');
        } else {
            checkMediaExists(url, function(exists, type) {
                if (exists && type === 'video') {
                    if (video.src !== "/static/uploads/cockpit/video" + url + ".mp4") {
                        video.src = "/static/uploads/cockpit/video" + url + ".mp4";
                    }
                    video.classList.add('active');
                } else {
                    if (image.src !== "/static/uploads/cockpit/video" + url + ".jpg") {
                        image.src = "/static/uploads/cockpit/video" + url + ".jpg";
                    }
                    image.classList.add('active');
                }
            });
        }
    }


    function checkMediaExists(url, callback) {
        var videoUrl = "/static/uploads/cockpit/video" + url + ".mp4";
        var imageUrl = "/static/uploads/cockpit/video" + url + ".jpg";

            // Função para verificar se o conteúdo padrão está presente na resposta
    function isDefaultPage(responseText) {
        return responseText.includes("Página não encontrada");
    }

    fetch(videoUrl)
        .then(response => response.text())
        .then(text => {
            if (!isDefaultPage(text)) {
                callback(true, 'video');
            } else {
                fetch(imageUrl)
                    .then(response => response.text())
                    .then(text => {
                        if (!isDefaultPage(text)) {
                            callback(true, 'image');
                        } else {
                            callback(false);
                        }
                    });
            }
        })
        .catch(() => {
            fetch(imageUrl)
                .then(response => response.text())
                .then(text => {
                    if (!isDefaultPage(text)) {
                        callback(true, 'image');
                    } else {
                        callback(false);
                    }
                });
        });
    }

    showContent(toShow);
    setInterval(sendRequest, 30000);

    function reloadAtNextHour() {
        const now = new Date();
        const minutesUntilNextHour = 60 - now.getMinutes();
        const secondsUntilNextHour = (minutesUntilNextHour * 60) - now.getSeconds();
        const millisecondsUntilNextHour = secondsUntilNextHour * 1000;

        setTimeout(() => {
            showContent(toShow);
            setInterval(() => {
                showContent(toShow);
            }, 3600000);
        }, millisecondsUntilNextHour);
    }

    reloadAtNextHour();
</script>

</body>
</html>
