<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            color: #fff;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header .title {
            font-size: 3vw;
            font-weight: bold;
            flex: 1;
        }
        .header h1 {
            flex: 2;
            margin: 0;
            font-size: 2em;
            margin-right: 25vw;
        }
        .content {
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        .photo-box, .text-box {
            background: #fff;
            color: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .photo-box {
            width: 45vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .photo {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 60vh;
        }
        .photo img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
        }
        .rating {
            font-size: 1.5em;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .buttons button {
            width: 3vw;
            height: 3vw;
            margin: 5px;
            font-size: 1em;
            color: #fff;
            background-color: #153A8A;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .buttons button:hover {
            background-color: #2e52a7;
        }
        .buttons button.selected {
            background-color: #000000;
        }
        .text-box {
            width: 45vw;
            height: 73vh;
            overflow-y: auto;
        }
        .text-box p {
            margin: 0;
            text-align: justify;
            white-space: pre-line; /* This handles the newline characters */
            font-size: large;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
            width: auto;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

    </style>
    <script>
        function selectRating(button) {
            const buttons = document.querySelectorAll('.buttons button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            // Envia a nota
            const nota = button.innerText;
            const postId = {{ id }};
            
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/gincana/inovacao/posts?update=1", true);
            xhr.setRequestHeader("Content-type", "application/json");
            xhr.send(JSON.stringify({ id: postId, note: nota, user:"{{user}}" }));
        }
        
        // Marcar o botão correto se a nota já foi preenchida
        window.onload = function() {
            const nota = {{ note }};
            if (nota > 0) {
                const buttons = document.querySelectorAll('.buttons button');
                buttons[nota - 1].classList.add('selected');
            }
        };

    </script>
</head>
<body>
    <div class="container">
        <div class="static-buttons"> 
            <form id="redirectForm" method="POST" action="/gincana/inovacao">
                <input type="hidden" name="user" id='user' style="display: none;" value="{{user}}">
                <button type="button">{{userName}}</button>
                <button onclick="window.location='/gincana/inovacao'"><i class="fas fa-x"></i></button>
            </form>
        </div>

        <div class="header">
            <div class="title">A JOST EVOLUI</div>
            <h1 id="titulo">{{title}}</h1>
        </div>
        <div class="content">
            <div class="photo-box">
                <div class="photo">
                    <img src="/static/uploads/gyncane/team_{{id}}.jpg" alt="Foto">
                </div>
                <div class="rating">AVALIE O POST</div>
                <div class="buttons">
                    <button onclick="selectRating(this)">1</button>
                    <button onclick="selectRating(this)">2</button>
                    <button onclick="selectRating(this)">3</button>
                    <button onclick="selectRating(this)">4</button>
                    <button onclick="selectRating(this)">5</button>
                    <button onclick="selectRating(this)">6</button>
                    <button onclick="selectRating(this)">7</button>
                    <button onclick="selectRating(this)">8</button>
                    <button onclick="selectRating(this)">9</button>
                    <button onclick="selectRating(this)">10</button>
                </div>
            </div>
            <div class="text-box">
                <p>{{text}}</p>
                <p style='margin-top: 3vw;'>Fontes:</p>
                <p style='margin-top: 0.5vw;'><em>{{source}}</em></p>
            </div>
        </div>
    </div>
</body>
</html>
