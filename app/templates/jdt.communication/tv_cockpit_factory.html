<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital JOST</title>
<link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
<style>
    body, html {
      margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* mínimo: evita scroll que atrapalha encaixe */
}

/* ✅ mínimo: variáveis vindas do AHK (querystring) com fallback igual ao original */
:root{
    --c1: {{ request.args.get('c1', '1fr') }};
    --c2: {{ request.args.get('c2', '1fr') }};
    --c3: {{ request.args.get('c3', '1fr') }};

    --r1: {{ request.args.get('r1', '1080px') }};
    --r2: {{ request.args.get('r2', '1fr') }};

    --ox: {{ request.args.get('ox', '0px') }};  /* ajuste fino horizontal */
    --oy: {{ request.args.get('oy', '0px') }};  /* ajuste fino vertical */
}

.grid-container {
    display: grid;

    /* ✅ mínimo: agora casa com o tamanho real de cada monitor */
    grid-template-columns: var(--c1) var(--c2) var(--c3);
    grid-template-rows: var(--r1) var(--r2);

    width: 100vw;
    height: 100vh;
    overflow: hidden;

    /* ✅ mínimo: corrige deslocamento esquerda/topo e “cobre” o espaço perdido */
    transform: translate(calc(var(--ox) * -1), calc(var(--oy) * -1));
    width:  calc(100vw + var(--ox));
    height: calc(100vh + var(--oy));
}

.grid-item {
    position: relative;
    width: 100%;
    height: 100%; /* mínimo: garante ocupar a célula inteira */
    overflow: hidden;
    background-color: black; /* mantém original */
}

.grid-item video,
.grid-item img {
    object-fit: cover;
    background-color: black;
    padding-top: 0;
    width: 100%;
    height: 100%; /* mínimo: evita sobras e desalinhamento */
}

.grid-item iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

/* mantém seus estilos originais do overlay */
#full-screen-iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    z-index: 1000;
    overflow: hidden;
}

#full-screen-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    z-index: 1000;
    overflow: hidden;
    object-fit: fill;
}

#full-screen-image {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    z-index: 1000;
    overflow: hidden;
    object-fit: fill;
}

</style>
</head>
<body>

<div class="grid-container">
    <div class="grid-item" id="item1"></div>
    <div class="grid-item" id="item2"></div>
    <div class="grid-item" id="item3"></div>
    <div class="grid-item" id="item4"></div>
    <div class="grid-item" id="item5"></div>
    <div class="grid-item" id="item6"></div>
</div>

<iframe id="full-screen-iframe"></iframe>
<video id="full-screen-video" autoplay muted playsinline loop></video>
<img id="full-screen-image">

<script>
    var test = {{ toShow | safe }};

    const width = window.innerWidth;
    const height = window.innerHeight;

    
    function tocarTodosVideosComDelay(delay = 1000) {
        setInterval(() => {
            const videos = document.querySelectorAll(".testVideo");

            videos.forEach(video => {
                video.play().catch(err => console.warn("Erro ao dar play:", err));
            });
        }, delay);
    }


    tocarTodosVideosComDelay();


    function updateContent(itemId, toShow) {
        const itemElement = document.getElementById(itemId);
        if (toShow.startsWith('/')) {
            itemElement.innerHTML = `<iframe src="${toShow}" frameborder="0"></iframe>`;
        } else {
            const videoUrl = `/static/uploads/cockpit/video${toShow.split(' ')[1]}.mp4`;
            const imgUrl = `/static/uploads/cockpit/video${toShow.split(' ')[1]}.jpg`;

            // Tenta carregar o vídeo
            fetch(videoUrl, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        const video = document.createElement("video");
                        video.autoplay = true;
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.preload = "auto";
                        video.classList.add('testVideo');

                        const source = document.createElement("source");
                        source.src = videoUrl;
                        source.type = "video/mp4";
                        video.appendChild(source);

                        itemElement.innerHTML = "";
                        itemElement.appendChild(video);

                        video.load();
                        video.play().catch((err) => {
                            console.warn("Erro ao tentar dar play:", err);
                        });
                    } else {
                        // Se não encontrar o vídeo, tenta carregar a imagem
                        const img = document.createElement("img");
                        img.src = imgUrl;
                        img.style.width = "100%";
                        img.style.height = "100%";
                        itemElement.innerHTML = "";
                        itemElement.appendChild(img);
                    }
                })
                .catch(() => {
                    // Se erro na requisição, tenta carregar a imagem
                    const img = document.createElement("img");
                    img.src = imgUrl;
                    img.style.width = "100%";
                    img.style.height = "100%";
                    itemElement.innerHTML = "";
                    itemElement.appendChild(img);
                });
        }
    }

    function sendRequest() {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/cockpit/fabrica", true);
        xhr.setRequestHeader("Content-type", "application/json");
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = xhr.responseText;

                if (response.includes('UPDATE PAGE')) {
                    const [_1, _, page, itemId] = response.split(' ');
                    updateContent(itemId, page);
                    test[itemId].page = page;
                    sendRequest()
                } else if (response.includes('CHANGE PAGE')) {
                    var url = response.split(' ');
                    if (url.length == 3) {
                        url = url[2]
                    } else {
                        url = url[3]
                    }
                    
                    showFullScreenIframe(url);
                } else if (response.includes('NOT UPDATE')) {
                    showFullScreenIframe(response)
                }
            }
        };
        xhr.send(JSON.stringify(test));
    }

    function showFullScreenIframe(url) {
        const iframe = document.getElementById('full-screen-iframe');
        const video = document.getElementById('full-screen-video');
        const image = document.getElementById('full-screen-image');

        if (url != 'NOT UPDATE') {
            if (url.length <= 2) {

                function checkVideoExists(test, callback) {
                    fetch(test, { method: 'HEAD' })
                        .then(response => {
                            if (response.includes("Página não encontrada")) {
                                callback(true);
                            } else {
                                callback(false);
                            }
                        })
                        .catch(error => {
                            callback(false);
                        });
                }

                var test = "/video/video" + url + ".mp4";
                checkVideoExists(test, function(exists) {
                    if (exists) {
                        if (video.style.display != 'block') {
                            image.style.display = 'none';
                            video.src = "/video/video" + url + ".mp4";
                            video.style.display = 'block';
                        }
                    } else {
                        if (image.style.display != 'block') {
                            video.style.display = 'none';
                            image.src = "/video/video" + url + ".jpg";
                            image.style.display = 'block';
                        }
                    }
                });


            } else {
                if (iframe.style.display != 'block') {
                    video.style.display = 'none';
                    image.style.display = 'none';
                    iframe.src = url
                    iframe.style.display = 'block';
                }
            }

        } else if (url == 'NOT UPDATE') {
            iframe.style.display = 'none';
            video.style.display = 'none';
            image.style.display = 'none';
        }

    }

    // Initial update
    for (let i = 0; i < 6; i++) {
        updateContent(`item${i + 1}`, test[i].page);
    }

    sendRequest()
    setInterval(sendRequest, 30000);

    function reloadAtNextHour() {
        const now = new Date();
        const minutesUntilNextHour = 60 - now.getMinutes();
        const secondsUntilNextHour = (minutesUntilNextHour * 60) - now.getSeconds();
        const millisecondsUntilNextHour = secondsUntilNextHour * 1000;

        // Primeiro timeout para esperar até a próxima hora cheia
        setTimeout(() => {
            // Recarrega a página
            window.location.reload();

            // Define o intervalo para recarregar a página a cada 1 hora (3600000 ms)
            setInterval(() => {
                window.location.reload();
            }, 3600000);
        }, millisecondsUntilNextHour);
    }

    // Executa a função
    reloadAtNextHour();

    (function() {
        // Salva a referência original da função confirm
        var originalConfirm = window.confirm;

        // Sobrescreve a função confirm
        window.confirm = function(message) {
            // Retorna sempre false para simular o cancelamento
            return false;
        };
    })();
    
</script>

</body>
</html>
