<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.min.js"></script>
  <title>Digital JOST</title>
  <link rel="icon" href="{{ url_for('static', filename='images/jost_icon.ico') }}">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
    }

    .video-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;

      /* NÃO deforma */
      object-fit: cover;

      /* mais estável que mudar top/left */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
  </style>
</head>

<body>
  <div class="video-container">
    <video id="video"
           src="/static/uploads/cockpit/video7.mp4"
           muted
           autoplay
           playsinline
           loop
           preload="auto"></video>
  </div>

  <script>
    // monitor_id precisa ser 0..5:
    // 0 1 2 (linha de cima)
    // 3 4 5 (linha de baixo)
    const monitorId = Number({{ monitor_id | tojson }});
    const video = document.getElementById('video');

    function applyWallSizingAndPosition() {
      // Use sempre o tamanho da JANELA (cada janela = um monitor)
      const w = Math.round(window.innerWidth);
      const h = Math.round(window.innerHeight);

      // vídeo gigante 3x2 (somando todos)
      video.style.width  = `${w * 3}px`;
      video.style.height = `${h * 2}px`;

      // calcula a célula (row/col) do monitorId
      const cols = 3;
      const row = Math.floor(monitorId / cols); // 0 ou 1
      const col = monitorId % cols;             // 0,1,2

      // move o recorte com translate3d (mais estável)
      const dx = -w * col;
      const dy = -h * row;

      video.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
    }

    // garante que a posição é aplicada assim que carregar e em qualquer resize
    window.addEventListener('resize', applyWallSizingAndPosition);
    document.addEventListener('DOMContentLoaded', applyWallSizingAndPosition);

    // garante que pause/seek só ocorre quando metadata existir
    video.addEventListener('loadedmetadata', () => {
      try {
        video.pause();
        video.currentTime = 0;
      } catch(e) {}
      applyWallSizingAndPosition();
    });

    // ======= Sincronização por socket: toca alinhado no segundo 10 =======
    function playAtSecond(targetSecond = 10) {
      // toca no próximo targetSecond do minuto (ex.: 10s)
      const now = new Date();
      const sec = now.getSeconds();
      const ms  = now.getMilliseconds();

      let deltaSec;
      if (sec <= targetSecond) {
        deltaSec = targetSecond - sec;
      } else {
        deltaSec = (60 - sec) + targetSecond;
      }

      const delay = (deltaSec * 1000) - ms;

      setTimeout(() => {
        // opcional: reinicia para sincronizar “frame 0”
        try { video.currentTime = 0; } catch(e) {}
        video.play().catch(() => {});
      }, Math.max(0, delay));
    }

    document.addEventListener("DOMContentLoaded", function() {
      // usa o mesmo protocolo da página (evita erro misto http/https)
      const socket = io(`${location.protocol}//${document.domain}:${location.port}/test`, {
        transports: ["websocket", "polling"]
      });

      socket.on('connect', function() {
        console.log('Connected to the server');
      });

      socket.on('server_message', function(msg) {
        // quando o servidor manda, alinha o play
        playAtSecond(10);
      });
    });
  </script>
</body>
</html>
