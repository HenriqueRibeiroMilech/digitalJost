<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            background-size: 600% 600%;
            animation: gradientAnimation 20s ease infinite;
            color: white;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sidebar {
            width: 20%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            position: fixed;
            overflow-y: hidden;
        }

        .sidebar-content {
            width: 100%;
            padding-top: 2vw;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar button {
            width: 90%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            font-size: 1.2rem;
            color: #2C3E50;
            background-color: #E8F4FA;
            border: 0.1rem solid #3498DB;
            border-radius: 0.3rem;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.3s, color 0.3s;
        }

        .sidebar button:hover {
            background-color: #3498DB;
            color: white;
        }

        .main-content {
            margin-left: 20%;
            width: 80%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .pdf-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 1rem;
            position: relative;
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        .pdf-container video {
            height: 90%;
            border: none;
            border-radius: 10px;
        }

        .header {
            text-align: center;
            font-size: 3vw;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .form-container {
            flex-grow: 1;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 1rem;
            color: white;
        }

        .form-container form {
            width: 100%;
            max-width: 700px;
            text-align: left;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="text"], textarea {
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
            background-color: #153A8A;
            color: white;
            cursor: pointer;
            text-align: center;
        }

        .file-label:hover {
            background-color: #2e52a7;
        }

        textarea {
            height: 100px;
            resize: none;
        }


        #loadingOverlay {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2vw;
        }

        .fixed-button {
            position: absolute;
            bottom: 4rem;
            left: calc(20% + 4rem);
            padding: 10px 20px;
            background-color: #3498DB;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }

        .fixed-button:hover {
            background-color: #2e52a7;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .history-table th, .history-table td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        .history-table th {
            background-color: #153A8A;
            color: white;
            text-align: left;
        }

        .history-table tr:hover {
            background-color: #ddd;
        }

        .history-table td button, .default-button {
            padding: 5px 10px;
            background-color: #3498DB;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .history-table td button:hover, .default-button:hover {
            background-color: #2e52a7;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

        .dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .dropbtn {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            text-align: left;
            width: 100%;
            height: 30vh;
            overflow-y: auto;
        }

        .dropdown-content label {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content label:hover {
            background-color: #f1f1f1;
        }

        .dropdown-content input {
            margin-right: 10px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background-color: #3e8e41;
        }

        .permission-container {
            margin-top: 10px;
            display: flex;
            align-items: center;
        }

        .permission-container input {
            flex-grow: 1;
        }

        .permission-container button, #create {
            margin-left: 10px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #153A8A;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .permission-container button:hover, #create:hover {
            background-color: #2e52a7;
        }

        .permission-list {
            margin-top: 10px;
        }

        .permission-item {
            background-color: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .permission-item button {
            background-color: transparent;
            border: none;
            color: white;
            cursor: pointer;
        }

        .permission-item button:hover {
            color: #ccc;
        }

        .permission-list {
            max-height: 12vh;
            overflow-y:scroll;
        }

        .dropdown-content::-webkit-scrollbar, .permission-list::-webkit-scrollbar {
            width: 8px;  /* Define a largura da barra de rolagem */
        }

        .dropdown-content::-webkit-scrollbar-track, .permission-list::-webkit-scrollbar-track {
            background: none;
        }

        .dropdown-content::-webkit-scrollbar-thumb, .permission-list::-webkit-scrollbar-thumb {
            background-color: rgb(125, 196, 255); /* Cor da barra de rolagem */
        }
    </style>
</head>
<body>
    <div class="static-buttons"> 
        <button style="margin:0" onclick="window.location='/biblioteca'"><i class="fas fa-x"></i></button>
    </div>
    <div class="sidebar">
        <div class="sidebar-content">
            <button onclick="showLibrary()" style="background-color: rgb(31, 84, 182);color: white">Informações da Biblioteca</button>
            <button onclick="showForm()" style="background-color: rgb(31, 84, 182);color: white" id="add_knowledge">Adicionar Conhecimento</button>
            {% for knowledge in knowledges %}
            <button onclick="showKnowledge('{{knowledge.id}}_{{ knowledge.version }}.{{knowledge.midiaType}}', '{{ knowledge.title }}', '{{knowledge.id}}')">{{ knowledge.title }}</button>
            {% endfor %}
        </div>
    </div>
    <div class="main-content">
        <div class="header">Biblioteca: {{title}}</div>
        <button class="fixed-button" id="back-button" onclick="showPDF()" style="display:none;">Voltar</button>
        <button class="fixed-button" id="view-history-button" onclick="showHistory()" style="display:none;">Ver Histórico</button>
        <div class="pdf-container" id="pdf-container">
            <iframe id="pdf-viewer" src="" type="application/pdf"></iframe>
            <video controls style='display: none;' id="video-container">
                <source src="" type="video/mp4">
                Seu navegador não suporta a tag de vídeo.
            </video>
        </div>

        <!-- Formulário para atualizar biblioteca -->
        <div class="form-container" id="library-container">
            
            <form id="createLibraryForm" method="POST" onsubmit="submitForm(event)">
                <h2>Biblioteca de Conhecimentos</h2>
                <label for="libraryName">Nome da Biblioteca:</label>
                <input type="text" id="libraryName" name="libraryName" required value="{{title}}">

                <label for="libraryDescription">Descrição da Biblioteca:</label>
                <textarea id="libraryDescription" name="libraryDescription" required>{{description}}</textarea>

                <label>Áreas Impactadas:</label>
                <div class="dropdown">
                    <button class="dropbtn" type="button">Selecione as áreas</button>
                    <div class="dropdown-content" id='areas'>
                        <label><input type="checkbox" name="areaImpactada" value="Engenharia de Processo"> Engenharia de Processo</label>
                        <label><input type="checkbox" name="areaImpactada" value="Manutenção"> Manutenção</label>
                        <label><input type="checkbox" name="areaImpactada" value="Engenharia de Produto"> Engenharia de Produto</label>
                        <label><input type="checkbox" name="areaImpactada" value="Excelência Operacional"> Excelência Operacional</label>
                        <label><input type="checkbox" name="areaImpactada" value="Compras"> Compras</label>
                        <label><input type="checkbox" name="areaImpactada" value="Controladoria"> Controladoria</label>
                        <label><input type="checkbox" name="areaImpactada" value="Produção"> Produção</label>
                        <label><input type="checkbox" name="areaImpactada" value="SSMA"> SSMA</label>
                        <label><input type="checkbox" name="areaImpactada" value="Comercial"> Comercial</label>
                        <label><input type="checkbox" name="areaImpactada" value="Campinas"> Campinas</label>
                        <label><input type="checkbox" name="areaImpactada" value="Engenharia da Qualidade"> Engenharia da Qualidade</label>
                        <label><input type="checkbox" name="areaImpactada" value="Logística"> Logística</label>
                        <label><input type="checkbox" name="areaImpactada" value="Gestão"> Gestão</label>
                        <label><input type="checkbox" name="areaImpactada" value="Engenharia de Fornecedores"> Engenharia de Fornecedores</label>
                        <!-- Adicione mais áreas conforme necessário -->
                    </div>
                </div>

                <div class="permission-container">
                    <input list='mail_list' type="text" id="permissionInput" placeholder="Adicione e-mails para ter permissão edição">
                    <button type="button" onclick="addPermission()">Adicionar</button>
                </div>
                <div class="permission-list" id="permissionList">
                    <!-- Nomes adicionados aparecerão aqui -->
                </div>

                <button type="submit" id="create" style="margin-left:0;margin-top: 1vh;">Atualizar Biblioteca</button>
            </form> 
        </div>

        <!-- Formulário para Adicionar Conhecimento -->
        <div class="form-container" id="form-container">
            <form id="knowledgeForm" enctype="multipart/form-data">
                <label for="title">Título do Conhecimento:</label>
                <input type="text" id="title" name="title" required>

                <label for="pdf">Arquivo PDF ou Video (.MP4):</label>
                <label class="file-label" for="pdf">Escolher arquivo</label>
                <input type="file" id="pdf" name="pdf" accept="application/pdf, video/mp4" required>

                <button type="button" onclick="submitKnowledge()" class='default-button' style='margin-top:1rem' id="add_knowledge2">Adicionar</button>
            </form>
        </div>

        <!-- Histórico de Conhecimento -->
        <div class="form-container" id="history-container" style="display:none;">
            <form id="updateKnowledgeForm" enctype="multipart/form-data">
                <label for="update-title">Atualizar Título do Conhecimento:</label>
                <input type="text" id="update-title" name="update-title" required>

                <label for="update-pdf">Atualizar Arquivo PDF ou Video (.MP4): </label>
                <label class="file-label" for="update-pdf">Escolher arquivo</label>
                <input type="file" id="update-pdf" name="pdf" accept="application/pdf, video/mp4" required>

                <button type="button" onclick="updateKnowledge()" class='default-button' style='margin-top:1rem'>Atualizar</button>
            </form>
            <h2>Histórico de Versões</h2>
            <table class="history-table" id="history-table">
                <thead>
                    <tr>
                        <th>Última vez atualizado</th>
                        <th>Atualizado por</th>
                        <th>Último título</th>
                        <th>Último arquivo</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dados do histórico irão aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <datalist id='mail_list'>
        {% for mail in mails %}
            <option>{{mail}}</option>
        {% endfor %}
    </datalist>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <p>Processando...</p>
    </div>

    <script>
        let selectedPdfUrl = '';
        let selectedKnowledgeName = '';
        let selectedKnowledgeId = '';
        
        if ({{admin}} != 1) {
            const inputs = document.querySelectorAll('input');
            const textareas = document.querySelectorAll('textarea');
            
            // Torna todos os inputs e textareas readonly
            inputs.forEach(input => {
                if (input.type === 'checkbox') {
                    input.disabled = true;
                } else {
                    input.readOnly = true;
                }
            });

            textareas.forEach(textarea => {
                textarea.readOnly = true;
            });

            document.getElementById('create').style.display = 'none'
            document.getElementById('add_knowledge').style.display = 'none'
            document.getElementById('add_knowledge2').style.display = 'none'
            document.getElementById('updateKnowledgeForm').style.display = 'none'
        }

        
        const mails = {{mails | safe}}
        
        const areas_received = {{areas | safe}}
        const permissions = {{permission | safe}}

        const areasDiv = document.getElementById('areas');
        const checkboxes = areasDiv.querySelectorAll('input[type="checkbox"]');

        // Percorre todos os checkboxes e realiza uma ação para cada um
        checkboxes.forEach(checkbox => {
            // Exemplo: Imprimir o valor de cada checkbox no console
            if (areas_received.includes(checkbox.value)) {
                checkbox.checked = true
            }
        });

        const permissionOld = document.getElementById('permissionList');
        var acum = 0

        permissions.forEach(permission => {
            const div = document.createElement("div");
            if (acum == 0) {
                div.style.marginTop = 0
            }
            div.className = "permission-item";
            div.innerHTML = `${permission} <button onclick="removePermission(this)">x</button>`;
            permissionOld.appendChild(div);
            acum++
        });
        
        
        function showLibrary() {

            const pdfContainer = document.getElementById('pdf-container');
            const formContainer = document.getElementById('form-container');
            const historyContainer = document.getElementById('history-container');
            const viewHistoryButton = document.getElementById('view-history-button');
            const libraryContainer = document.getElementById('library-container');
            const backButton = document.getElementById('back-button');


            pdfContainer.style.display = 'none';
            formContainer.style.display = 'none';
            historyContainer.style.display = 'none';
            viewHistoryButton.style.display = 'none';
            libraryContainer.style.display = 'flex';
            backButton.style.display = 'none';
        }

        function showKnowledge(pdfUrl, knowledgeName, KnowledgeId) {
            selectedPdfUrl = pdfUrl;
            selectedKnowledgeName = knowledgeName;
            selectedKnowledgeId = KnowledgeId;


            if (pdfUrl.includes('.mp4')) {
                elementView = 'video-container'
                document.getElementById('pdf-viewer').style.display = 'none'
                document.getElementById('video-container').style.display = 'block'
            } else {
                elementView = 'pdf-viewer'
                document.getElementById('pdf-viewer').style.display = 'block'
                document.getElementById('video-container').style.display = 'none'
            }

            const pdfViewer = document.getElementById(elementView);
            const pdfContainer = document.getElementById('pdf-container');
            const formContainer = document.getElementById('form-container');
            const historyContainer = document.getElementById('history-container');
            const viewHistoryButton = document.getElementById('view-history-button');
            const libraryContainer = document.getElementById('library-container');
            const backButton = document.getElementById('back-button');


            pdfViewer.src = '/static/uploads/library/' + pdfUrl;
            pdfContainer.style.display = 'flex';
            formContainer.style.display = 'none';
            historyContainer.style.display = 'none';
            viewHistoryButton.style.display = 'block';
            libraryContainer.style.display = 'none';
            backButton.style.display = 'none';

        }

        function showPDF() {
            const pdfContainer = document.getElementById('pdf-container');
            const historyContainer = document.getElementById('history-container');
            const viewHistoryButton = document.getElementById('view-history-button');
            const backButton = document.getElementById('back-button');
            const libraryContainer = document.getElementById('library-container');

            pdfContainer.style.display = 'flex';
            historyContainer.style.display = 'none';
            viewHistoryButton.style.display = 'block';
            backButton.style.display = 'none';
            libraryContainer.style.display = 'none';
        }

        function showForm() {
            const pdfContainer = document.getElementById('pdf-container');
            const formContainer = document.getElementById('form-container');
            const historyContainer = document.getElementById('history-container');
            const viewHistoryButton = document.getElementById('view-history-button');
            const backButton = document.getElementById('back-button');
            const libraryContainer = document.getElementById('library-container');


            pdfContainer.style.display = 'none';
            formContainer.style.display = 'flex';
            historyContainer.style.display = 'none';
            viewHistoryButton.style.display = 'none';
            backButton.style.display = 'none';
            libraryContainer.style.display = 'none';

        }

        function showHistory() {
            const pdfContainer = document.getElementById('pdf-container');
            const historyContainer = document.getElementById('history-container');
            const viewHistoryButton = document.getElementById('view-history-button');
            const backButton = document.getElementById('back-button');
            const libraryContainer = document.getElementById('library-container');

            pdfContainer.style.display = 'none';
            historyContainer.style.display = 'flex';
            historyContainer.style.flexDirection = 'column';
            viewHistoryButton.style.display = 'none';
            backButton.style.display = 'block';
            libraryContainer.style.display = 'none';

            document.getElementById('update-title').value = selectedKnowledgeName;

            fetch('/biblioteca/consultar?id=' + selectedKnowledgeId, {method: 'POST'})
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('history-table').querySelector('tbody');
                    tableBody.innerHTML = '';

                    data.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${item.createDate}</td>
                            <td>${item.createdBy}</td>
                            <td>${item.title}</td>
                            <td><button onclick="downloadFile('${item.url}')">Download</button></td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Erro ao obter histórico:', error));
        }

        function downloadFile(url) {
            window.open('/biblioteca/conhecimentos/download?arq=' + url, '_blank');
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function submitKnowledge() {
            

            const form = document.getElementById('knowledgeForm');

            if (!form.checkValidity()) {
                form.reportValidity();  // Exibe as mensagens de erro padrão do navegador
                return false;
            }
            showLoading();
            const formData = new FormData(form);

            fetch('/biblioteca/conhecimentos?action=insert&id={{id}}', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                hideLoading();
                if (data == 'INSERTED') {
                    location.reload();
                } else {
                    alert('Erro ao adicionar conhecimento.');
                }
            })
            .catch(error => {
                hideLoading();
                console.error('Erro:', error);
                alert('Erro ao adicionar conhecimento.');
            });
        }

        function updateKnowledge() {
            
            const form = document.getElementById('updateKnowledgeForm');
            
            if (!form.checkValidity()) {
                form.reportValidity();  // Exibe as mensagens de erro padrão do navegador
                return false;
            }

            const formData = new FormData(form);
            showLoading();

            fetch('/biblioteca/conhecimentos?action=update&id={{id}}&book=' + selectedKnowledgeId, {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                hideLoading();
                if (data = 'UPDATED') {
                    window.location.reload()
                } else {
                    alert('Erro ao atualizar conhecimento.');
                }
            })
            .catch(error => {
                hideLoading();
                console.error('Erro:', error);
                alert('Erro ao atualizar conhecimento.');
            });
        }
    
        function addPermission() {
            const permissionInput = document.getElementById("permissionInput");
            const permissionList = document.getElementById("permissionList");

            if (permissionInput.value.trim() !== "") {
                if (mails.includes(permissionInput.value.trim())) {
                    if (!permissionList.innerHTML.includes(permissionInput.value.trim())) {
                        const div = document.createElement("div");
                        if (acum == 0) {
                            div.style.marginTop = 0
                        }
                        div.className = "permission-item";
                        div.innerHTML = `${permissionInput.value.trim()}<button onclick="removePermission(this)">x</button>`;
                        permissionList.appendChild(div);
                        permissionInput.value = "";
                        acum++
                    } else {
                        alert("Email já possui permissão")
                    }
                } else {
                    alert ('Email não encontrado na nossa base de dados.')
                }
            }
        }

        function removePermission(button) {
            const div = button.parentElement;
            div.remove();
            acum--
        }

        function submitForm(event) {
            event.preventDefault();
            showLoading();

            const libraryName = document.getElementById("libraryName").value;
            const libraryDescription = document.getElementById("libraryDescription").value;
            const areaImpactada = Array.from(document.querySelectorAll("input[name='areaImpactada']:checked")).map(checkbox => checkbox.value);
            const permissions = Array.from(document.querySelectorAll(".permission-item")).map(div => div.textContent.trim().slice(0, -1));

            const data = {
                title: libraryName,
                description: libraryDescription,
                impactedAreas: areaImpactada,
                permission: permissions,
                'id': {{id}}
            };

            fetch('/biblioteca/conhecimentos?action=library&id={{id}}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                hideLoading();
                return response;
            })
            .then(data => {
                window.location.reload();
            })
            .catch(error => {
                hideLoading();
                console.error('Error:', error);
            });
        }
    
    
    </script>
</body>
</html>
