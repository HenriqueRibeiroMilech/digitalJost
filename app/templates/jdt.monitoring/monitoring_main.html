<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            animation: GradientAnimation 10s ease infinite;
        }

        @keyframes GradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 1200px;
        }

        h1 {
            color: #153A8A;
            font-size: 3.5em;
            margin-bottom: 10px;
            margin-top: 1vh;
        }

        h2 {
            color: #333;
            font-size: 1.2em;
            font-weight: normal;
            margin: 10px 0;
        }

        p {
            color: #333;
            font-size: 1em;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 2vh;
        }

        .button-container a, .button-container button {
            background-color: rgba(255, 255, 255, 0.8);
            color: #153A8A;
            padding: 15px 30px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            cursor: pointer;
            font-size: 1.1em;
            width: 10vw;
        }

        .button-container a:hover, .button-container button:hover {
            background-color: #2e52a7;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            background-size: 600% 600%;
            animation: GradientAnimation 10s ease infinite;
            color: white;
            margin: auto;
            padding: 20px;
            border: none;
            width: 60%;
            max-width: 700px;
            border-radius: 10px;
            text-align: center;
        }

        .title {
            margin-bottom: 10px;
            font-size: 2.3em;
            font-weight: bold;
            color: white;
        }

        .sol_btn {
            background-color: white;
            color: #153A8A;
            padding: 15px 30px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            cursor: pointer;
            margin: 5px;
            font-size: 1.1em;
            width: 15vw;
        }

        .sol_btn:hover {
            background-color: #2e52a7;
            color: white;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

        .close {
            color: white;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #ccc;
            text-decoration: none;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: none;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgb(125, 196, 255);
        }

    </style>
</head>
<body>
    <div class="static-buttons"> 
        <button onclick="window.location='/'"><i class="fas fa-x"></i></button>
    </div>

    <div class="container" style="margin-bottom: 1vh;">

        <h1>Monitoramento Industrial</h1>
        <h2>Visualização em tempo real de dados para apoio na fábrica.</h2>

        <div class="button-container">
            <button onclick="window.location='/monitoramento/paradas'" id="b1">Alerta de Paradas</button>
            <button onclick="openModal('modalAreas')" id="b2">Tela de OEE</button>
            <button onclick="window.location='/monitoramento/hardware'" id="b3">Hardwares Industriais</button>
            <button onclick="window.location='/monitoramento/geral'" id="b4">Painel Geral</button>
            <button onclick="window.location='/monitoramento/erros'" id="b5">Visão de Erros</button>

        </div>
    </div>

    <div id="modalAreas" class="modal">
        <div class="modal-content">
            <span onclick="closeModal('modalAreas')" class="close">&times;</span>
            <p class="title">Selecione o centro de trabalho:</p>
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; margin-top: 2vh; height:40vh; overflow:auto;">
                {% for workcenter in workcenters %}
                    <button
                        class="sol_btn"
                        onclick="location.href='http://digitaljost.randon.com.br:6979/monitoramento/oee?ct={{workcenter.Workcenter_Code}}'">
                        {{workcenter.Name}}
                    </button>
                {% endfor %}
            </div>
        </div>
    </div>
</body>

<script>
    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

</script>
</html>
