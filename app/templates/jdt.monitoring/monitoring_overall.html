<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            animation: GradientAnimation 10s ease infinite;
        }

        @keyframes GradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sidebar {
            width: 12vw;
            background-color: #153A8A;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            padding-bottom: 10px;
            text-align: center;
        }

        .sidebar-text {
            font-size: 2em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .sidebar button {
            background-color: white;
            color: #153A8A;
            padding: 10px 20px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 1em;
            width: 80%;
        }

        .sidebar button:hover {
            background-color: #2e52a7;
            color: white;
        }

        .legend {
            font-size: 0.9em;
            margin-bottom: 20px;
            text-align: left;
        }

        .legend p {
            margin: 5px 0;
            font-weight: bold;
        }

        .color-box {
            width: 15px;
            height: 15px;
            display: inline-block;
            margin-right: 5px;
            border-radius: 3px;
        }

        .container {
            display: flex;
            flex-direction: row;
            flex-grow: 1;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            background-size: 600% 600%;
            animation: GradientAnimation 10s ease infinite;
            color: white;
            margin: auto;
            padding: 20px;
            border: none;
            width: 60%;
            max-width: 700px;
            border-radius: 10px;
            text-align: center;
        }

        .title {
            margin-bottom: 10px;
            font-size: 2em;
            font-weight: bold;
            color: white;
        }

        .filter-checkbox {
            margin: 10px;
            font-size: 1.5em;
            width: 45%;
            text-align: left;
        }

        .filter-checkbox input {
            transform: scale(1.5);
        }

        .apply-button {
            background-color: white;
            color: #153A8A;
            padding: 10px 20px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            cursor: pointer;
            font-size: 1.1em;
        }

        .apply-button:hover {
            background-color: #2e52a7;
            color: white;
        }

        .close {
            color: white;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #ccc;
            text-decoration: none;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
            z-index: 5;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

        .teams-button {
            margin-top: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: calc(0.25vw + 0.9vh);
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 2;
            background-color: #153A8A;
            color: white;
        }

        table th, table td {
            padding: 7px;
            text-align: left;
            border: 1px solid #ddd;
        }
        
        .area {
            flex: 1;
            padding-top: 0;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-y:hidden;
        }

        .border-processos {
            box-shadow: inset 15px 0 0 0 #007BFF;
        }

        .border-qualidade {
            box-shadow: inset 15px 0 0 0 #DC3545;
        }

        .border-producao {
            box-shadow: inset 15px 0 0 0 #6610F2;
        }

        .border-logistica {
            box-shadow: inset 15px 0 0 0 #17A2B8;
        }

        .border-manutencao {
            box-shadow: inset 15px 0 0 0 #6C757D;
        }
        
        .border-transformacao-digital {
            box-shadow: inset 15px 0 0 0 #FFC107;
        }

        .border-rodando {
            box-shadow: inset 15px 0 0 0 #98f210;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: none;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgb(125, 196, 255);
        }

    </style>
</head>
<body>
    <div class="static-buttons"> 
        <button onclick="window.location='/monitoramento'"><i class="fas fa-x"></i></button>
    </div>

    <div class="sidebar">
        <div class="sidebar-text">Painel<br>Geral</div>
        
        <div class="legend">
            <p style="width: 100%;text-align: center;margin-top: 2vh;">Paradas</p>
            <div id='motive'>
                <p><span class="color-box" style="background-color: #007BFF;"></span>Processos</p>
                <p><span class="color-box" style="background-color: #DC3545;"></span>Qualidade</p>
                <p><span class="color-box" style="background-color: #6610F2;"></span>Produção</p>
                <p><span class="color-box" style="background-color: #17A2B8;"></span>Logística</p>
                <p><span class="color-box" style="background-color: #6C757D;"></span>Manutenção</p>
                <p><span class="color-box" style="background-color: #FFC107;"></span>Transf. Digital</p>
            </div>
        </div>
        <button onclick="openModal('filterModal')">Filtrar Dados</button>

    </div>

    <div class="container">
        <div class="area">
            <div style='overflow-y: auto;width: 100%;'>         
                <table>
                    <thead>
                        <tr>
                            <th>Centro de Trabalho</th>
                            <th>OEE</th>
                            <th>Meta</th>
                            <th>Status</th>
                            <th>Duração</th>
                        </tr>
                    </thead>
                    <tbody id="infoTableBody1">
                        <!-- Conteúdo gerado via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="area">
            <div style='overflow-y: auto;width: 100%;'>         
                <table>
                    <thead>
                        <tr>
                            <th>Centro de Trabalho</th>
                            <th>OEE</th>
                            <th>Meta</th>
                            <th>Status</th>
                            <th>Duração</th>
                        </tr>
                    </thead>
                    <tbody id="infoTableBody2">
                        <!-- Conteúdo gerado via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="filterModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal('filterModal')" class="close">&times;</span>
            <p class="title">Selecione as áreas:</p>
            <div style="display: flex; flex-wrap: wrap; justify-content: center;">
                <label class="filter-checkbox"><input type="checkbox" value="Montagem"> Montagem</label>
                <label class="filter-checkbox"><input type="checkbox" value="Usinagem"> Usinagem</label>
                <label class="filter-checkbox"><input type="checkbox" value="Soldagem"> Soldagem</label>
                <label class="filter-checkbox"><input type="checkbox" value="Pré-Fabricação"> Pré-Fabricação</label>
            </div>
            <button class="apply-button" onclick="loadData()">Aplicar</button>
        </div>
    </div>

    <script>

        let first = true;

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }
    
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function loadData() {

            const statusFilter = [];
            document.querySelectorAll('.filter-checkbox input:checked').forEach((checkbox) => {
                    statusFilter.push(checkbox.value);
            });

            fetch('/monitoramento/geral', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ statusFilter: statusFilter })
            }).then(response => response.json()).then(data => {
                renderData(data);
            });

            if (first) {
                setInterval(loadData, 30000);
                first = false
            }

            closeModal('filterModal')
        }

        function renderData(data) {

            const mid = Math.ceil(data.length / 2); // Encontre o meio do array
            const dataLeft = data.slice(0, mid);   // Primeira metade dos dados
            const dataRight = data.slice(mid);     // Segunda metade dos dados

            // Preencher a primeira tabela
            const tableBody1 = document.getElementById("infoTableBody1");
            tableBody1.innerHTML = ""; // Limpar o conteúdo existente
            dataLeft.forEach(item => {
                addRowToTable(tableBody1, item);
            });

            // Preencher a segunda tabela
            const tableBody2 = document.getElementById("infoTableBody2");
            tableBody2.innerHTML = ""; // Limpar o conteúdo existente
            dataRight.forEach(item => {
                addRowToTable(tableBody2, item);
            });
        }

        function addRowToTable(tableBody, item) {
            const row = document.createElement("tr");
            const eventName = String(item.Event || '').trim();
            const isLackOfBalance = eventName.replace(/^-+\s*/, '') === 'Falta de Saldo';
            const displayedEventName = isLackOfBalance
                ? 'Falta de Saldo'
                : eventName.replace(/^\d+\s*-\s*/, '');

            // item.Oee = item.Performance * item.Availability * 100 / 10000;
            // if (item.Oee < 0) item.Oee = 0;

            let cell = document.createElement('td');
            cell.innerHTML = `<strong>${item.Workcenter}</strong>`;
            cell.onclick = () => openModal('modalRequest', material);
            cell.style.cursor = 'pointer';
            row.appendChild(cell);

            cell = document.createElement('td');
            cell.innerHTML = `${Number(item.OEE || 0).toFixed(0)}%`;
            row.appendChild(cell);

            cell = document.createElement('td');
            cell.innerHTML = `${item.Goal}%`;
            cell.style.fontWeight = 'bold';

            if ((item.OEE || 0) >= item.Goal) {
                cell.style.backgroundColor = '#28A745';
                cell.style.color = 'black';
            } else {
                cell.style.backgroundColor = '#DC3545';
                cell.style.color = 'white';
            }

            row.appendChild(cell);

            cell = document.createElement('td');

            let statusClass = '';
            if (isLackOfBalance) {
                statusClass = 'border-logistica';
            } else if (item.Responsible == 'Processos') {
                statusClass = 'border-processos';
            } else if (item.Responsible === 'Qualidade') {
                statusClass = 'border-qualidade';
            } else if (item.Responsible === 'Mão de Obra' || item.Responsible === 'Programada') {
                statusClass = 'border-producao';
            } else if (item.Responsible === 'Material' || item.Responsible === 'Movimentação') {
                statusClass = 'border-logistica';
            } else if (item.Responsible === 'Manutenção') {
                statusClass = 'border-manutencao';
            } else if (item.Responsible === 'Transformação Digital') {
                statusClass = 'border-transformacao-digital';
            } else {
                statusClass = 'border-rodando';
            }

            cell.className = `${statusClass}`
            cell.style.boxSizing = 'border-box';
            cell.style.paddingLeft = '10px'
            cell.innerHTML += eventName != "-"
                ? `&ensp;${displayedEventName}`
                : "&ensp;Produzindo";


            row.appendChild(cell);

            cell = document.createElement('td');
            cell.innerHTML = `<strong>${item.Log_Duration}</strong>`;
            row.appendChild(cell);

            tableBody.appendChild(row);
        }

        window.onload = function() {
            loadData()
        };

    </script>
    
</body>
</html>
