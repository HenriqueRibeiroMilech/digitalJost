<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            color: #fff;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(21, 58, 138, 0.9);
            z-index: 10;
        }

        .login-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #000;
            width: 80%;
            max-width: 400px;
        }

        .title {
            font-size: 2.5vw;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .sub-title {
            font-size: 1em;
            margin-bottom: 20px;
        }

        .login-button {
            margin-top: 1vw;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #153A8A;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s;
        }
        .login-button:hover {
            background-color: #2e52a7;
        }
        
        .login-button.loading {
            pointer-events: none;
            color: transparent;
        }
        
        .login-button.loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-top: -10px;
            margin-left: -10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .input-container {
            margin-bottom: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .input-container label {
            margin-bottom: 5px;
        }
        .input-container input {
            width: 90%;
            padding: 10px;
            font-size: 1em;
            border: 2px solid transparent;
            border-radius: 5px;
            cursor: pointer;
        }

        .input-container input:focus,
        .input-container input.selected {
            outline: none;
            border: 2px solid #2e52a7;
        }

        #mainScreen {
            display: none;
            position: relative;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
        }

        .kids-day-title {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 10px;
            font-size: 2.5rem;
            text-align: center;
            color: #153A8A;
            margin-bottom: 40px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 700px;
        }

        .category-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 2rem;
            width: 80%;
            max-width: 700px;
        }

        .category-button {
            padding: 2rem 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }

        .category-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .bagunceira {
            background-color: #FF9800;
        }
        .bagunceira:hover {
            background-color: #F57C00;
        }

        .estilosa {
            background-color: #E91E63;
        }
        .estilosa:hover {
            background-color: #C2185B;
        }

        .braba {
            background-color: #673AB7;
        }
        .braba:hover {
            background-color: #512DA8;
        }

        .careta {
            background-color: #4CAF50;
        }
        .careta:hover {
            background-color: #388E3C;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
            width: auto;
            z-index: 1000;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1vw;
            margin-left: 0.5rem;
            transition: background-color 0.3s;
            position: relative;
        }

        .static-buttons button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .static-buttons button#userName.loading {
            padding-left: 2rem;
        }
        
        .static-buttons button#userName.loading::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 10px;
            top: 50%;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        /* Estilos para alertas customizados */
        .custom-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            color: #333;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1100;
            display: flex;
            align-items: center;
            min-width: 300px;
            max-width: 80%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, transform 0.3s;
        }
        
        .custom-alert.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(10px);
        }
        
        .custom-alert .alert-icon {
            margin-right: 15px;
            font-size: 1.5rem;
        }
        
        .custom-alert.error .alert-icon {
            color: #d32f2f;
        }
        
        .custom-alert.warning .alert-icon {
            color: #f57c00;
        }
        
        .custom-alert.success .alert-icon {
            color: #388e3c;
        }
        
        .custom-alert .alert-content {
            flex: 1;
        }
        
        .custom-alert .alert-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .custom-alert .alert-close {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 5px;
            margin-left: 10px;
        }
        
        .custom-alert .alert-close:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="static-buttons"> 
        <button id='userName'>REALIZE O LOGIN</button>
        <button onclick="window.location='/manutencao/controle/consulta'"><i class="fas fa-x"></i></button>
    </div>

    <div class="modal" id="loginScreen">
        <div class="login-box">
            <div class="title">Dia das Crianças JOST</div>
            <div class="sub-title">Clique no campo e Leia o crachá para fazer login</div>
            <div class="input-container">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" placeholder="Clique aqui" oninput="verify()" autocomplete="off">
            </div>
            <button id="loginBtn" class="login-button" onclick="login()">Fazer Login</button>
        </div>
    </div>

    <div id="mainScreen">
        <div class="kids-day-title">
            Dia das Crianças JOST<br>
            <span style="font-size: 1.5rem; font-weight: normal;">Vote na sua categoria favorita</span>
        </div>
        <div class="category-group">
            <button class="category-button bagunceira" onclick="submitForm('/extra/votar/bagunceira')">Bagunceira</button>
            <button class="category-button estilosa" onclick="submitForm('/extra/votar/estilosa')">Estilosa</button>
            <button class="category-button braba" onclick="submitForm('/extra/votar/braba')">Braba</button>
            <button class="category-button careta" onclick="submitForm('/extra/votar/careta')">Careta</button>
        </div>
    </div>

    <!-- Container para alertas customizados -->
    <div id="customAlert" class="custom-alert">
        <div class="alert-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <div class="alert-content">
            <div class="alert-title">Título do Alerta</div>
            <div class="alert-message">Mensagem do alerta</div>
        </div>
        <button class="alert-close" onclick="closeAlert()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script>
        // Substituir o bloco de verificação de usuário
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se é fabrica_jost e se já tem sessão ativa
            if ('{{user}}' == 'fabrica_jost' && '{{is_session_active|lower}}' != 'true') {
                // Se for fabrica_jost e NÃO tem sessão ativa, mostrar tela de login
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainScreen').style.display = 'none';
            } else {
                // Se NÃO for fabrica_jost OU já tem sessão ativa
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'flex';
                
                // Definir informações do usuário
                currentUser = '{{user}}';
                document.getElementById('userName').innerText = '{{ user_name }}';
            }
        });

        async function autoLogin(userId) {
            try {
                const response = await fetch('/extra/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user: userId })
                });
                
                if (response.ok) {
                    const resultText = await response.text();
                    currentUser = userId;
                    document.getElementById('mainScreen').style.display = 'flex';
                    document.getElementById('userName').classList.remove('loading');
                    document.getElementById('userName').innerText = resultText.split(';')[1];
                    showAlert('Login Automático', 'Você foi autenticado automaticamente.', 'success');
                } else {
                    // Mostrar erro e redirecionar
                    showAlert('Erro de Autenticação', 'Não foi possível autenticar seu usuário.', 'error');
                    setTimeout(() => {
                        window.location.href = '/manutencao/controle/consulta';
                    }, 3000);
                }
            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro de Conexão', 'Erro ao fazer login. Verifique sua conexão.', 'error');
                setTimeout(() => {
                    window.location.href = '/manutencao/controle/consulta';
                }, 3000);
            }
        }

        // Resto do script permanece igual
        document.getElementById('matricula').addEventListener('paste', function(event) {
            event.preventDefault();
            showAlert('Ação não permitida', 'Colar não é permitido neste campo.', 'warning');
        });

        // Controle de alertas customizados
        let alertTimeout;
        function showAlert(title, message, type = 'warning') {
            const alertElement = document.getElementById('customAlert');
            const alertIcon = alertElement.querySelector('.alert-icon i');
            const alertTitle = alertElement.querySelector('.alert-title');
            const alertMessage = alertElement.querySelector('.alert-message');
            
            // Remover classes anteriores
            alertElement.classList.remove('error', 'warning', 'success');
            
            // Definir ícone baseado no tipo
            if (type === 'error') {
                alertIcon.className = 'fas fa-exclamation-circle';
                alertElement.classList.add('error');
            } else if (type === 'warning') {
                alertIcon.className = 'fas fa-exclamation-triangle';
                alertElement.classList.add('warning');
            } else if (type === 'success') {
                alertIcon.className = 'fas fa-check-circle';
                alertElement.classList.add('success');
            }
            
            // Definir conteúdo
            alertTitle.textContent = title;
            alertMessage.textContent = message;
            
            // Mostrar alerta
            alertElement.classList.add('show');
            
            // Limpar timeout anterior
            if (alertTimeout) {
                clearTimeout(alertTimeout);
            }
            
            // Definir novo timeout
            alertTimeout = setTimeout(() => {
                closeAlert();
            }, 5000);
        }
        
        function closeAlert() {
            const alertElement = document.getElementById('customAlert');
            alertElement.classList.remove('show');
        }

        let focusedInput = 'matricula';
        document.getElementById(focusedInput).classList.add('selected');
        let currentUser;
        let inputStart = 0;
        let inputEnd = 0;

        function verify() {
            const matricula = document.getElementById('matricula');
            if (inputStart === 0) {
                inputStart = new Date().getTime();
            }
            inputEnd = new Date().getTime();
            if ((inputEnd - inputStart) > 50) {
                matricula.value = '';
                inputStart = 0;
            } else if (matricula.value.length == 12) {
                if (matricula.value.startsWith('2300')) {
                    matricula.value = matricula.value.slice(4);
                    inputStart = 0;
                    login();
                } else {
                    matricula.value = '';
                    inputStart = 0;
                    showAlert('Erro de Leitura', 'Má leitura de crachá, segure mais tempo!', 'error');
                }
            }
        }

        async function login() {
            const matricula = document.getElementById('matricula').value;
            if (matricula.length == 8) {
                try {
                    // Mostrar estado de carregamento
                    const loginBtn = document.getElementById('loginBtn');
                    loginBtn.classList.add('loading');
                    
                    const response = await fetch('/extra/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ user: matricula })
                    });
                    
                    // Remover estado de carregamento
                    loginBtn.classList.remove('loading');
                    
                    if (response.ok) {
                        const resultText = await response.text();
                        currentUser = matricula;
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('mainScreen').style.display = 'flex';
                        document.getElementById('userName').classList.remove('loading');
                        document.getElementById('userName').innerText = resultText.split(';')[1];
                        showAlert('Login Bem-sucedido', 'Você foi autenticado com sucesso.', 'success');
                    } else {
                        showAlert('Erro de Autenticação', 'Matrícula não encontrada!', 'error');
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    showAlert('Erro de Conexão', 'Erro ao fazer login. Verifique sua conexão.', 'error');
                }
            } else {
                showAlert('Campo Vazio', 'Matrícula não preenchida!', 'warning');
            }
        }

        function submitForm(url) {
            const matricula = currentUser;
            if (!matricula) {
                showAlert('Erro de Sessão', 'Usuário não identificado. Faça login novamente.', 'error');
                return;
            }

            // Cria o elemento form temporário
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = url;

            // Cria o campo de entrada para 'matricula' e adiciona ao form
            const matriculaField = document.createElement('input');
            matriculaField.type = 'hidden';
            matriculaField.name = 'user';
            matriculaField.value = matricula;

            // Adiciona o campo ao form
            form.appendChild(matriculaField);

            // Adiciona o form ao body e submete
            document.body.appendChild(form);
            form.submit();
        }

        // Define o tempo de espera (5 minutos = 300000 ms)
        const redirectTime = 300000;

        // Função para redirecionar e fechar a página atual
        function redirectAndClose() {
            window.location.href = '/manutencao/controle/consulta';
        }

        // Inicia o temporizador para redirecionar
        setTimeout(redirectAndClose, redirectTime);
    </script>
</body>
</html>
