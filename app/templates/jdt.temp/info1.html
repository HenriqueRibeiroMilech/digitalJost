<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            color: #fff;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #mainScreen {
            display: none;
            position: relative;
            height: 100vh;
            width: 100vw;
            background-image: url('{{ url_for('static', filename='images/extra2.jpg') }}');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
            width: auto;
            z-index: 5;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

    </style>
</head>
<body>
    <div class="static-buttons"> 
        <button>{{user}}</button>
        <button onclick="window.location='/extra'"><i class="fas fa-x"></i></button>
    </div>

    <div id="mainScreen">
    </div>

    <script>
        // Define o tempo de espera (3 minutos = 180000 ms)
        const redirectTime = 180000;
    
        // Função para redirecionar e fechar a página atual
        function redirectAndClose() {
            window.location.href = '/manutencao/controle/consulta';  // URL para redirecionar
            window.close();  // Fecha a janela atual
        }
    
        // Inicia o temporizador para redirecionar e fechar a página após 3 minutos
        setTimeout(redirectAndClose, redirectTime);
    </script>
</body>
</html>
