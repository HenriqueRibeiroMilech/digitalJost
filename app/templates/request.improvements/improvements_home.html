<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
        <link rel="stylesheet" href="{{ url_for('static', filename= 'css/style_module.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename= 'css/style_lab.css') }}">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    
        <title>TDG - JOST Brasil</title>
        <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    </head>
    
    <body class="page_body">
        <a id="select_back" href="/">&times;</a>

        <div class="lab_overlay">
            <p class="lab_title">Selecione uma área:</p>
            <button class="sol_btn" onclick="closeInfo('Transformação Digital')">Transformação Digital</button>
            <button class="sol_btn">Em breve...</button>
        </div>

        <div class="blur_wrap">

            <div class="sol_text_wrapper">
                <p class="sol_title">Demandas</p>
                <p class="sol_desc" id="description">Solicite uma demanda para a área de</p>
                <p class="sol_desc">Você também pode acompanhar aqui o status de suas demandas.</p>
            </div>

            <div class="sol_btn_wrapper">
                <button class="sol_btn" onclick="changeLoc('/solicitar/melhorias')">Solicitar nova demanda</button>
                <button style="margin-left:2vh" class="sol_btn" onclick="window.location.href='/solicitar/dash'">Indicadores</button>
                <br>
                <button class="sol_btn" onclick="changeLoc2('/solicitar/view', 'melhorias')">Visualizar demandas</button>
                <button style="margin-left:2vh" class="sol_btn" onclick="window.location.href='/demandas/gerenciador'">Gerenciador de Tarefas</button>
                <br>
                <button class="sol_btn" onclick="changeLoc2('/solicitar/manage', 'melhorias')">Gerenciar demandas</button>
            </div>

        </div>
    </body>

    <script>
        {% include 'request.improvements/improvements_home.js' %}
    </script>
