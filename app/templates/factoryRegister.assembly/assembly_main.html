<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            animation: GradientAnimation 10s ease infinite;
        }

        @keyframes GradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 1500px;
        }


        h1 {
            color: #153A8A;
            font-size: 3.5em;
            margin-bottom: 10px;
            margin-top: 1vh;
        }

        h2 {
            color: #333;
            font-size: 1.2em;
            font-weight: normal;
            margin: 10px 0;
        }

        p {
            color: #333;
            font-size: 1em;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 2vh;
        }

        .button-container a, .button-container button {
            background-color: rgba(255, 255, 255, 0.8);
            color: #153A8A;
            padding: 15px 30px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            cursor: pointer;
            font-size: 1.1em;
            width: 15vw;
        }

        .button-container a:hover, .button-container button:hover {
            background-color: #2e52a7;
            color: white;
        }

        .title {
            margin-bottom: 10px;
            font-size: 2.3em;
            font-weight: bold;
            color: white;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

    </style>
</head>
<body>
    <div class="static-buttons"> 
        <button onclick="window.location='/'"><i class="fas fa-x"></i></button>
    </div>

    <div class="container" style="margin-bottom: 1vh;">

        <h1>Rastreabilidade Quinta Roda</h1>
        <h2>Menu geral de aplicações voltadas à rastreabilidade das QR's JOST.</h2>

        <div class="button-container">
            <button onclick="window.location='/rastreabilidade/qr/cadastro/1'" id="show1">Cadastro - M01</button>
            <button onclick="window.location='/rastreabilidade/qr/cadastro/2'" id="show2">Cadastro - M02</button>
            <button onclick="window.location='/rastreabilidade/qr/cadastro/6'" id="show3">Cadastro - M06</button>
            <button onclick="window.location='/rastreabilidade/qr/plaquetas'">Envio de Plaquetas</button>
            <button onclick="window.location='http://svh-aut-07/ReportServer/Pages/ReportViewer.aspx?%2fJOST%2frptConsultaRastreabilidadeQR&rs:Command=Render'">Rastreabilidade</button>
        </div>

        <div style="display: flex;flex-direction: row;justify-content: center;margin-top: 5vh;height: 35vh;opacity: 0;" id="images">
            <img src="/static/images/qr37cxw.png" style="width: 50%;">
            <img src="/static/images/qr38cxs.png" style="width: 50%;">
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const container = document.getElementById('images');
            container.style.transition = 'opacity 1s ease';
            container.style.opacity = 1;

            if ('{{show}}' == 0) {
                document.getElementById('show1').style.display = 'none'
                document.getElementById('show2').style.display = 'none'
                document.getElementById('show3').style.display = 'none'
            }
        });
    </script>
</body>
</html>
