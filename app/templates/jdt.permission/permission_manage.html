<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* O estilo é mantido conforme solicitado */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            animation: GradientAnimation 10s ease infinite;
        }

        @keyframes GradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 1800px;
            text-align: center;
        }

        h1 {
            color: #153A8A;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .filter-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .filter-container input {
            width: 45%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        table th, table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #153A8A;
            color: white;
        }

        table td button {
            background-color: #2e52a7;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        table td button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .fa-check-circle {
            color: #28a745;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: none;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgb(125, 196, 255);
        }
    </style>
</head>
<body>
    <div class="static-buttons">
        <button onclick="window.location='/usuarios'"><i class="fas fa-x"></i></button>
    </div>

    <div class="container">
        <h1>Gerenciar Permissões - {{areaName}}</h1>
        <div class="filter-container">
            <input type="text" id="filterUserId" placeholder="Filtrar por Matricula" onkeyup="filterTable()">
            <input type="text" id="filterUserName" placeholder="Filtrar por Nome" onkeyup="filterTable()">
        </div>
        <div style='height: 60vh;overflow-y: auto;'>         
            <table>
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Área</th>
                        <th>Pode distribuir<br>permissões da área</th>
                        <th>Permissões</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Conteúdo gerado via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tableData = JSON.parse({{ table | tojson }});
        const currentAreaId = '{{ areaId }}';

        function populateTable(data) {
            const tableBody = document.getElementById('userTableBody');
            tableBody.innerHTML = '';  // Limpa o conteúdo anterior

            data.forEach(user => {
                const row = document.createElement('tr');

                // Coluna MATRICULA
                let cell = document.createElement('td');
                cell.textContent = user['id'];
                row.appendChild(cell);

                // Coluna NOME
                cell = document.createElement('td');
                cell.textContent = user['name'];
                row.appendChild(cell);

                // Coluna CARGO
                cell = document.createElement('td');
                cell.textContent = user['position'];
                row.appendChild(cell);

                // Coluna ÁREA
                cell = document.createElement('td');
                cell.textContent = user['areaName'];
                row.appendChild(cell);

                // Coluna Pode distribuir permissões da área
                cell = document.createElement('td');
                const button = document.createElement('button');

                if (user['areaId'] == currentAreaId) {

                    if (user['role']) {
                        button.textContent = 'Remover';
                        button.style.backgroundColor = 'red'
                        button.value = 'remove'
                    } else {
                        button.textContent = 'Atribuir';
                        button.style.backgroundColor = 'black'
                        button.value = 'assign'
                    }

                    button.onclick = () => {
                        const url = `/usuarios/area?id=${currentAreaId}&user=${user['id']}&type=${button.value}`;

                        fetch(url, {
                            method: 'POST',
                        }).then(response => {
                            if (response.status == 403) {
                                alert("Apenas coordenadores e líders podem dar esta permissão")
                                return
                            }

                            if (button.value == 'assign') {
                                button.textContent = 'Remover';
                                button.style.backgroundColor = 'red'
                                button.value = 'remove'
                            } else {
                                button.textContent = 'Atribuir';
                                button.style.backgroundColor = 'black'
                                button.value = 'assign'
                            }
                        });
                    };
                } else {
                    button.textContent = 'Usuário de área diferente';
                    button.disabled = true;
                }

                cell.appendChild(button);
                row.appendChild(cell);

                // Coluna PERMISSÕES
                cell = document.createElement('td');
                const permButton = document.createElement('button');
                permButton.textContent = 'Ver Permissões';
                permButton.onclick = () => {
                    const url = `/usuarios/area/permissao?id=${currentAreaId}&user=${user['id']}`;
                    window.location.href = url;
                };
                cell.appendChild(permButton);
                row.appendChild(cell);

                tableBody.appendChild(row);
            });
        }

        function filterTable() {
            const userIdInput = document.getElementById('filterUserId').value.toLowerCase();
            const userNameInput = document.getElementById('filterUserName').value.toLowerCase();
            const filteredData = tableData.filter(user => 
                user['id'].toLowerCase().includes(userIdInput) &&
                user['name'].toLowerCase().includes(userNameInput)
            );
            populateTable(filteredData);
        }

        // Inicializa a tabela com os dados ao carregar a página
        document.addEventListener('DOMContentLoaded', () => populateTable(tableData));
    </script>
</body>
</html>
