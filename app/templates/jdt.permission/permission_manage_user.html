<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Estilo mantém a consistência com a página anterior */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            animation: GradientAnimation 10s ease infinite;
        }

        @keyframes GradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 1800px;
            max-height: 95vh;
            text-align: center;
        }

        h1 {
            color: #153A8A;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .user-info {
            text-align: left;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .user-info p {
            margin: 5px 0;
        }

        .user-info p span {
            font-weight: bold;
            font-size: 2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #153A8A;
            color: white;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        table td button {
            background-color: #2e52a7;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        table td button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: none;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgb(125, 196, 255);
        }
    </style>
</head>
<body>
    <div class="static-buttons">
        <button onclick="window.location='/usuarios/area?id={{areaId}}'"><i class="fas fa-x"></i></button>
    </div>

    <div class="container">
        <h1>Gerenciar Permissões de {{areaName}}</h1>
        
        <div class="user-info">
            <p><span>{{userName}}</span> ({{user}})</p>
            <p>Área: {{userArea}}</p>
            <p>Cargo: {{userPosition}}</p>
        </div>

        <div style='max-height: 55vh;overflow-y: auto;'>         
            <table>
                <thead>
                    <tr>
                        <th>Nome do Acesso</th>
                        <th>Descrição do Acesso</th>
                        <th>Permissão</th>
                    </tr>
                </thead>
                <tbody id="permissionTableBody">
                    <!-- Conteúdo gerado via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const permissionData = JSON.parse({{ allRoles | tojson }});
        const userRoles = {{ userRoles | tojson }};
        const currentUser = '{{ user }}';
        const currentAreaId = '{{ areaId }}';

        function populatePermissionTable(data) {
            const tableBody = document.getElementById('permissionTableBody');
            tableBody.innerHTML = '';  // Limpa o conteúdo anterior

            data.forEach(permission => {
                const row = document.createElement('tr');

                // Coluna Nome do Acesso
                let cell = document.createElement('td');
                cell.textContent = permission['name'];
                row.appendChild(cell);

                // Coluna Descrição do Acesso
                cell = document.createElement('td');
                cell.textContent = permission['description'];
                row.appendChild(cell);

                // Coluna Permissão
                cell = document.createElement('td');
                const button = document.createElement('button');

                if (userRoles.includes(permission['name'])) {
                    button.textContent = 'Remover';
                    button.style.backgroundColor = 'red';
                    button.value = 'remove';
                } else {
                    button.textContent = 'Atribuir';
                    button.style.backgroundColor = 'black';
                    button.value = 'assign';
                }

                button.onclick = () => {
                    const url = `/usuarios/area/permissao?user=${currentUser}&id=${currentAreaId}`;

                    const payload = {
                        accessName: permission['name'],
                        action: button.value
                    };

                    fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    }).then(response => {
                        if (response.ok) {
                            if (button.value == 'assign') {
                                button.textContent = 'Remover';
                                button.style.backgroundColor = 'red';
                                button.value = 'remove';
                            } else {
                                button.textContent = 'Atribuir';
                                button.style.backgroundColor = 'black';
                                button.value = 'assign';
                            }
                        } else {
                            alert('Erro ao alterar permissão.');
                        }
                    });
                };

                cell.appendChild(button);
                row.appendChild(cell);

                tableBody.appendChild(row);
            });
        }

        // Inicializa a tabela com os dados ao carregar a página
        document.addEventListener('DOMContentLoaded', () => populatePermissionTable(permissionData));
    </script>
</body>
</html>
