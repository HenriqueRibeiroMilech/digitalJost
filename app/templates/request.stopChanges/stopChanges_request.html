<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital JOST</title>
    <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            animation: GradientAnimation 10s ease infinite;
        }

        @keyframes GradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 1800px;
            text-align: center;
        }

        h1 {
            color: #153A8A;
            font-size: 2.5em;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .filter-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .filter-container input {
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 1vw;
            height: 30px;
        }

        .title {
            margin-bottom: 10px;
            margin-top: 20px;
            font-size: 2.3em;
            font-weight: bold;
            color: white;
        }

        .sub-title {
            font-size: 1.5em;
            color: white;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        table th, table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #153A8A;
            color: white;
        }

        button {
            background-color: #2e52a7;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        table td.status-approved {
            background-color: #4CAF50;
            color: white;
        }

        table td.status-pending {
            background-color: #FFEB3B;
            color: black;
        }

        table td.status-rejected {
            background-color: #F44336;
            color: white;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: none;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgb(125, 196, 255);
        }

        .static-buttons {
            position: absolute;
            right: 1vw;
            top: 1vw;
            z-index: 1001;
        }

        .static-buttons button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1vw;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(270deg, #153A8A, #2e52a7, #3563c8);
            background-size: 600% 600%;
            animation: GradientAnimation 10s ease infinite;
            color: white;
            margin: auto;
            padding: 20px;
            border: none;
            width: 70%;
            max-width: 900px;
            border-radius: 10px;
            text-align: center;
        }

        .close {
            color: white;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #ccc;
            text-decoration: none;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 20vh;
            display: inline-block;
            margin-top: 2vh;
            resize: none;
            font-size: 1.5em;
        }

        label {
            display: block; /* Faz o label ocupar toda a largura disponível */
            margin-bottom: 5px; /* Espaçamento entre o label e o campo */
            margin-right: 1vw;
        }

        select {
            height: 50px;
            padding: 5px; /* Adiciona um pouco de preenchimento */
            box-sizing: border-box; /* Inclui padding e border na largura total */
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }


        .flex-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 40px;
        }

        .left-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .right-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }



    </style>
</head>
<body>
    <div class="static-buttons">
        <button onclick="window.location='/oee/paradas/alterar'"><i class="fas fa-x"></i></button>
    </div>

    <div id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <h1>Solicitar - Alteração de Parada</h1>
        <div class="filter-container">

            <div class="form-group">
                <label for="workCenter">Centro de Trabalho</label>
                <select id="workCenter">
                    <option disabled value="">Selecione uma opção</option>
                    {% for workcenter in workcenters %}
                        {% if workcenter.Workcenter_Key != 1 %}
                            <option value="{{ workcenter.Workcenter_Key }}">
                                {{ workcenter.Workcenter_Code }} - {{ workcenter.Name }}
                            </option>
                        {% else %}
                            <option value="{{ workcenter.Workcenter_Code }}-{{ workcenter.Name }}">
                                {{ workcenter.Workcenter_Code }} - {{ workcenter.Name }}
                            </option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
            <label for="motive">Motivo Atual</label>
                <select id="motive">
                    <option disabled value="">Selecione uma opção</option>
                    {% for event in events %}
                        <option value="{{event.Code}}">{{event.Code}} - {{event.Description}}</option>
                    {% endfor %}
                </select>
            </div>  

            <div class="form-group">
            <label for="initDate">Hora de Inicio</label>
            <input type="datetime-local" id="initDate" value="{{initDateFilter}}">
            </div>

            <div class="form-group">
                <label for="endDate">Hora de Fim </label>
                <input type="datetime-local" id="endDate" value="{{endDateFilter}}">
            </div>

            <button onclick="populateTable()">Pesquisar Paradas</button>

        </div>

        <div style='height: 60vh;overflow-y: auto;'>         
            <table>
                <thead>
                    <tr>
                        <th>HORA DE INÍCIO</th>
                        <th>HORA DE FIM</th>
                        <th>DURAÇÃO</th>
                        <th>ALTERAÇÃO</th>
                    </tr>
                </thead>
                <tbody id="stopTable">
                    <!-- Conteúdo gerado via JavaScript -->
                </tbody>
            </table>
        </div>

    </div>

    <div id="modalRequest" class="modal">
        <div class="modal-content" style="max-width: 1000px;">
            <span onclick="closeModal('modalRequest')" class="close">&times;</span>
            <p class="title">Solicitar Alteração de Parada</p>
            <div class="flex-container">
                <!-- LADO ESQUERDO -->
                <div class="left-info">
                    <p class="sub-title" id='selectedEvent'></p>
                    <p class="sub-title" id='selectedWorkcenter'></p>
                    <p class="sub-title" id='selectedDate'></p>
                    <p class="sub-title" id='selectedDuration'></p>

                    <p class="sub-title" style="margin-top: auto; font-style: italic;">
                        OBS: Não solicite a alteração sem ter certeza. Em caso de dúvidas, converse com todas as áreas envolvidas.
                    </p>
                </div>
    
                <!-- LADO DIREITO -->
                <div class="right-form">
                    <label class="sub-title" for="newMotive">Selecione o novo motivo:</label>
                    <select id="newMotive">
                        <option disabled selected value="">Selecione uma opção</option>
                        {% for event in events %}
                            <option value="{{ event.Code }}">{{event.Code}} - {{event.Description}}</option>
                        {% endfor %}
                    </select>
    
                    <label class="sub-title" for="requestText">Justifique a alteração:</label>
                    <textarea id="requestText" rows="5" style="margin-top: 0px;"></textarea>

                    <button id="requestButton" style="background-color: black;margin-top: auto;">Solicitar</button>
                </div>
            </div>
    
        </div>
    </div>

    <script>

        document.getElementById('workCenter').value = JSON.parse('{{ workCenterFilter | tojson | safe }}')[0] || ''
        document.getElementById('motive').value = JSON.parse('{{ motiveFilter | tojson | safe }}')[0] || ''


        function requestChange(info) {

            var newMotive = document.getElementById('newMotive').value
            var requestText = document.getElementById('requestText').value

            if (newMotive == '' || requestText == '') {
                alert("Você deve preencher todos os campos.")
                return
            }

            const payload = {
                Log_Key: info['Log_Key']
                , Plex: info['Plex']
                , newMotive: newMotive
                , requestText: requestText
            }

            showLoading();

            fetch('/oee/paradas/alterar/solicitar?type=request', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.status === 403) {

                    alert('Já existe uma solicitação em andamento para este evento!');
                    throw new Error('403 - Forbidden');
                }
                return response.text();
            })            
            .then(text => {
                const id = text.split(' ')[2];  // Extrai apenas o número do ID (assumindo 'NEW ID <numero>')
                window.location.href = `/oee/paradas/alterar/solicitacoes/${id}?origin=solicitar`;
            })
            .catch(error => {
                console.error('Error:', error);
            })
            .finally(() => {
                hideLoading();
            });
        }

        function populateTable() {

            
            const payload = {
                shift : ['1', '2', '3', 'Extra']
                , m_event: [document.getElementById('motive').value]
                , w_name_mic: [document.getElementById('workCenter').value]
                , start_date: document.getElementById('initDate').value
                , end_date: document.getElementById('endDate').value
            }

            for (const field in payload) {
                if (payload[field] == "") {
                    alert("Você deve preencher todos os campos.")
                    return
                }
            }
            
            showLoading() 

            payload['w_name_plex'] = Number.isInteger(parseInt(document.getElementById('workCenter').value)) ? [parseInt(document.getElementById('workCenter').value)] : []


            fetch('/oee/paradas/alterar/solicitar?type=search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())  // Convert the response to JSON
            .then(data => {

                const tableBody = document.getElementById('stopTable');
                tableBody.innerHTML = '';  // Limpa o conteúdo anterior
                
                if (data.length === 0) {
                    data = [{
                        'Log_Date': 'Nenhuma parada encontrada'
                        , 'End_Date': '-'
                        , 'Log_Minutes': '0'
                    }];
                }

                // Usar DocumentFragment para melhorar o desempenho
                const fragment = document.createDocumentFragment();

                data.forEach(info => {
                    const row = document.createElement('tr');

                    if (info['requested']) {
                        row.style.backgroundColor = '#153a8a39'
                        row.style.fontWeight = 'bold'
                    }
                    
                    // Lista de campos a serem preenchidos
                    const fields = ['Log_Date', 'End_Date', 'Log_Minutes'];

                    // Cria células para cada campo
                    fields.forEach(field => {
                        const cell = document.createElement('td');

                        if (field == 'Log_Minutes') {
                            cell.textContent = `${info[field]} min`;
                        } else {
                            cell.textContent = info[field];
                        }

                        row.appendChild(cell);
                    });


                    // Criação da célula para o botão ou texto
                    const actionCell = document.createElement('td');
                    if (info['Log_Date'] === 'Nenhuma parada encontrada') {
                        actionCell.textContent = 'Não disponível';
                    } else {

                        if (info['requested']) {
                            actionCell.textContent = `Parada em fluxo de alteração.`;
                                
                        } else {
                            const button = document.createElement('button');
                            button.textContent = 'Alterar Parada';
                            button.onclick = () => openModal(info);
                            actionCell.appendChild(button);
                        }

                    }

                    row.appendChild(actionCell);
                    fragment.appendChild(row);
                });

                // Adicionar tudo de uma vez ao tableBody
                tableBody.appendChild(fragment);
            })
            .catch(error => {
                console.error('Error:', error);
            }).finally(() => {
                hideLoading()
            });
        }


        // FUNÇÕES PARA ABRIR/FECHAR MODAL DE SOLICITAR ALTERAÇÃO

        function openModal(info) {

            document.getElementById('selectedEvent').innerHTML = `<strong>Parada atual: ${info['Code']} - ${info['Event']}</strong>`
            document.getElementById('selectedWorkcenter').innerHTML = '<strong>Centro de Trabalho: </strong>' + info['Workcenter_Name']
            document.getElementById('selectedDate').innerHTML = '<strong>Data de início: </strong>' + info['Log_Date']
            document.getElementById('selectedDuration').innerHTML = `<strong>Duração: </strong>${info['Log_Minutes']} min`
            document.getElementById('modalRequest').style.display = 'flex';
            document.getElementById('requestButton').onclick = () => requestChange(info)

        }

        function closeModal(id) {
            document.getElementById('modalRequest').style.display = 'none';
        }


        // FUNÇÕES PARA ATIVAR O EFEITO DE CARREGAMENTO

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

    </script>
</body>
</html>
