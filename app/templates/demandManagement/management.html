<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciador de Demandas</title>
    <link rel="icon" href="{{ url_for('static', filename='images/jost_icon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/demand_management.css') }}">
</head>
<body>
<main class="dm-page" aria-labelledby="dm-title">
    <a class="dm-back" href="{{ url_for('main.landing_page_get') }}">&larr; Voltar para o início</a>
    <header class="dm-hero">
        <div class="dm-hero__copy">
            <h1 id="dm-title">Gerenciador de Demandas</h1>
            <p id="dm-subtitle">Demandas aprovadas da Transformação Digital.</p>
        </div>
        <div class="dm-summary" id="dm-summary" aria-label="Resumo das demandas"></div>
    </header>

    <nav class="dm-tabs" aria-label="Áreas do gerenciador">
        <button class="dm-tab" type="button" data-view="demands">
            Demandas
        </button>
        <button class="dm-tab" type="button" data-view="requests">
            Solicitações <span class="dm-tab__count" id="dm-pending-count">0</span>
        </button>
    </nav>

    <section id="dm-demands-view">
        <div class="dm-demand-actions">
            <span>Registre suas atividades internas do dia a dia.</span>
            <button class="dm-button" id="dm-create-demand" type="button" disabled>+ Nova atividade</button>
        </div>
        <section class="dm-toolbar" aria-label="Filtros das demandas">
            <label class="dm-search">
                <span>Buscar por título</span>
                <span class="dm-search__control">
                    <input id="dm-search" type="search" placeholder="Ex.: painel de produção" autocomplete="off">
                </span>
            </label>

            <label>
                <span>Responsável</span>
                <select id="dm-filter-responsible"><option value="">Todos</option></select>
            </label>
            <label>
                <span>Tipo</span>
                <select id="dm-filter-type"><option value="">Todos</option></select>
            </label>
            <label>
                <span>Status</span>
                <select id="dm-filter-status"><option value="">Todos</option></select>
            </label>
            <label>
                <span>Dificuldade</span>
                <select id="dm-filter-difficulty"><option value="">Todas</option></select>
            </label>
            <button class="dm-button dm-button--quiet" id="dm-clear-filters" type="button">
                Limpar filtros
            </button>
        </section>

        <div class="dm-feedback" id="dm-loading" role="status">
            <span class="dm-spinner" aria-hidden="true"></span>
            Carregando demandas...
        </div>

        <section class="dm-board" id="dm-board" aria-live="polite"></section>
    </section>

    <section id="dm-requests-view" hidden>
        <section class="dm-toolbar dm-review-toolbar" aria-label="Filtros das solicitações">
            <label class="dm-search">
                <span>Buscar por título</span>
                <span class="dm-search__control">
                    <input id="dm-request-search" type="search" placeholder="Ex.: integração de dados" autocomplete="off">
                </span>
            </label>
            <label>
                <span>Tipo</span>
                <select id="dm-request-type"><option value="">Todos</option></select>
            </label>
            <label>
                <span>Status</span>
                <select id="dm-request-status">
                    <option value="0">Em análise</option>
                    <option value="3">Recusadas</option>
                    <option value="">Todas</option>
                </select>
            </label>
            <label>
                <span>Urgência</span>
                <select id="dm-request-urgency">
                    <option value="">Todas</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
            </label>
            <button class="dm-button dm-button--quiet" id="dm-clear-request-filters" type="button">
                Limpar filtros
            </button>
        </section>

        <div class="dm-feedback" id="dm-request-loading" role="status">
            <span class="dm-spinner" aria-hidden="true"></span>
            Carregando solicitações...
        </div>
        <section class="dm-review-grid" id="dm-request-list" aria-live="polite"></section>
    </section>
</main>

<div class="dm-modal" id="dm-modal" aria-hidden="true">
    <div class="dm-modal__backdrop" data-close-modal></div>
    <section class="dm-modal__panel" role="dialog" aria-modal="true" aria-labelledby="dm-modal-title">
        <button class="dm-modal__close" type="button" data-close-modal aria-label="Fechar detalhes">&times;</button>
        <div id="dm-modal-content"></div>
    </section>
</div>

<div class="dm-toast" id="dm-toast" role="status" aria-live="polite"></div>

<script>
    window.demandManagementConfig = {
        apiRoot: {{ url_for('demand_management.management_list') | tojson }},
        area: {{ area | tojson }},
        csrfToken: {{ csrf_token | tojson }},
        initialView: {{ initial_view | tojson }},
        currentUserName: {{ current_user_name | tojson }}
    };
</script>
<script defer src="{{ url_for('static', filename='js/demand-management/management.js') }}"></script>
</body>
</html>
