<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
        <link rel="stylesheet" href="{{ url_for('static', filename= 'css/style_module.css') }}">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    
        <title>TDG - JOST Brasil</title>
        <link rel="icon" href="{{ url_for('static', filename= 'images/jost_icon.ico') }}">

   <body class="page_body">
        <a id="select_back" href="/">&times;</a>

        <div class="sol_text_wrapper">
            <p class="sol_title">Gerenciamento de Computadores da JOST</p>
            <p class="sol_desc">Solicite um novo computador, ou de baixa no seu computador pela plataforma.</p>
            <p class="sol_desc">Você também pode ver todos os registros por aqui.</p>
        </div>

        <div class="sol_btn_wrapper">
            <button class="sol_btn" onclick="changeLoc('/computadores/novo')">Solicitar computador</button>
            <button style="margin-left:2vh" class="sol_btn" onclick="changeLoc('/reg/computadores/baixa')">Dar baixa</button>
            <br>
            <button class="sol_btn" onclick="changeLoc('/computadores/registros')">Visualizar e editar</button>
            <button class="sol_btn" onclick="changeLoc('/computadores/gerenciar')" style="margin-left:2vh">Gerênciar aprovações</button></div>
   </body>

   <script>
        function changeLoc(loc) {
            window.location = loc;
        }
   </script>
